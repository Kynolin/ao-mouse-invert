name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: x86
            platform: Win32
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: cmake -B build -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: dinput8-${{ matrix.arch }}
          path: build/Release/dinput8.dll

  # Pushing a tag like v1.0.0 publishes a GitHub Release with a ready-to-use zip.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package
        run: |
          mkdir -p pkg/x64 pkg/x86
          cp dist/dinput8-x64/dinput8.dll pkg/x64/
          cp dist/dinput8-x86/dinput8.dll pkg/x86/
          cp dinput8_invert.ini README.md LICENSE THIRD_PARTY_NOTICES.md pkg/
          cd pkg && zip -r "../ao-mouse-invert-${GITHUB_REF_NAME}.zip" .

      - uses: softprops/action-gh-release@v2
        with:
          files: ao-mouse-invert-*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}